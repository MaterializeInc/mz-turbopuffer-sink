[project]
name = "mz-tpuf-sink-cli"
version = "0.1.0"
description = "Command-line interface for the mz-tpuf-sink Materialize → turbopuffer sink"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Materialize", email = "support@materialize.com" }
]
dependencies = [
    "mz-tpuf-sink>=0.1.0",
    "click>=8.4.2",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
mz-tpuf-sink = "mz_tpuf_sink_cli.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
mz-tpuf-sink = { workspace = true }
