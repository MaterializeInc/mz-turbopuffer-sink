[project]
name = "mz-tpuf-sink"
version = "0.1.0"
description = "Atomically sink Materialize Kafka topics (Avro + Debezium) into turbopuffer"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Materialize", email = "support@materialize.com" }
]
dependencies = [
    "confluent-kafka[avro,schemaregistry]>=2.15.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "turbopuffer>=2.8.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
