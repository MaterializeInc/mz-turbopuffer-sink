[project]
name = "mz-turbopuffer-sink-workspace"
version = "0"
description = "Development workspace for the mz-tpuf-sink packages"
requires-python = ">=3.12"
dependencies = [
    "mz-tpuf-sink",
    "mz-tpuf-sink-cli",
]

[tool.uv]
# the root is a development shell, not a distribution
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
mz-tpuf-sink = { workspace = true }
mz-tpuf-sink-cli = { workspace = true }

[tool.pytest.ini_options]
# e2e/ needs Docker and a real turbopuffer key; run it explicitly with
# `uv run pytest e2e`
testpaths = ["packages/mz-tpuf-sink/tests", "packages/mz-tpuf-sink-cli/tests"]
# each package has its own tests/ directory; importlib mode keeps same-named
# test modules in different packages from colliding
addopts = "--import-mode=importlib"
# e2e test modules share helpers from e2e/harness.py
pythonpath = ["e2e"]

[dependency-groups]
dev = [
    "fastavro>=1.12.2",
    "pytest>=9.1.1",
]
