[project]
name = "mz-tpuf-sink"
version = "0.1.0"
description = "Atomically sink Materialize Kafka topics (Avro + Debezium) into turbopuffer"
readme = "README.md"
authors = [
    { email = "sjwiesman@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "confluent-kafka[avro,schemaregistry]>=2.15.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "turbopuffer>=2.8.0",
]

[project.scripts]
mz-tpuf-sink = "mz_tpuf_sink.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# e2e/ needs Docker and a real turbopuffer key; run it explicitly with
# `uv run pytest e2e`
testpaths = ["tests"]

[dependency-groups]
dev = [
    "fastavro>=1.12.2",
    "pytest>=9.1.1",
]
